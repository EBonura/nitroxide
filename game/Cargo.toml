[package]
name    = "nitroxide"
version = "0.5.0"
edition = "2021"
# Matches PSoXide, whose SDK and engine this links.
license = "GPL-2.0-or-later"
repository = "https://github.com/EBonura/nitroxide"

[features]
default = ["pad-irq-engine"]
# Read the pads from the interrupt-driven pad engine instead of polling them
# from the frame loop (sdk/docs/PAD-IRQ-ENGINE.md).
pad-irq-engine = ["psx-engine/pad-irq-engine"]
# Dev shortcut: boot straight into the match for headless capture.
boot-play = []
# Dev: boot into a match whose boost meters are driven through a fixed script
# (small pickup, big pickup, a long burn, another pickup) so the meter can be
# captured at known ticks.
diag-meter = ["boot-play"]
# Dev: boot into a match and drive the sim state through every in-match
# feedback effect at fixed ticks (shot, save, demolition, aerial goal, minute
# banner, landing, pad, wall, ball off screen) so each can be captured.
diag-fb = ["boot-play"]
# Dev: print the kickoff fly-over's camera every call (progress, eye, the chase
# camera it hands over to) on the TTY, for the fly-over's path to be plotted.
diag-intro = []
# Dev: the split-screen boot, but through a real match start, so the kickoff
# fly-over, countdown and GO! can be profiled.
boot-split-kickoff = ["boot-split-play"]
# Dev: the split kickoff with only two seconds on a level clock, so it goes
# to overtime at once.
boot-split-overtime = ["boot-split-kickoff"]
# Dev: the single-player match start with two seconds on a level clock.
boot-overtime = ["boot-play"]
# Dev shortcut: the normal kickoff with both player views enabled, used to
# profile split-screen renderer changes without requiring a second host pad.
boot-split-play = []
# Engine frame/stage markers only: enough for the headless profiler to report
# the per-visual-frame render total, with none of this crate's own markers in
# it. This is the build to read a frame budget off, because `profile` adds
# about 2,800 cycles a marker and there are two dozen of them.
profile-frame = ["psx-engine/emulator-telemetry"]
# Emit guest telemetry so the headless profiler can see per-stage cycles.
# Off by default: the markers cost real cycles, so a shipping disc must not
# carry them, and a profile of a build with them in it is measuring itself.
profile = ["profile-frame", "psx-telemetry/emit"]
# Dev: kick off with the ball rolling at the far net, so a headless run
# reaches a goal at a predictable tick and the celebration can be looked at.
boot-goal = []
# Dev: boot-goal with the opponent left on its AI, so the goal and the kickoff
# after it are seen with a car that was driving when the ball went in.
boot-goal-ai = []
# Dev: park the car against a side wall, ball ahead of it, so a headless
# capture always frames the same shot. Driving there with scheduled pad
# presses does not repeat: one extra tick of steer and the car is somewhere
# else entirely, which makes a before/after comparison worthless.
boot-wall = []
# Dev: put both players on opposing side walls so the complete curved wall
# profile is reproducible in each half of a split-screen wireframe capture.
boot-split-wall = []
# Dev: the same, jammed into a corner chamfer. This is the darkest view in
# the game and the one any lighting change has to be judged on.
boot-corner = []
# Dev-only model selectors for deterministic visual QA of every garage car.
boot-hatch = []
boot-sprinter = []
# Dev: NITRO_CAR0 at build time picks seat 0's car (an index into draw::CAR_NAMES),
# so a recorded tape can be replayed with any car without a second pad.
boot-car = []
# Dev: ball parked airborne in front of the car, the only view that shows a
# whole shadow. Gravity is left on, so capture early.
boot-airball = []
# Dev: deterministic close wheel pose (full steering lock, visible roll, and
# opposite axle travel) for high-resolution renderer QA.
boot-wheels = []
# Dev: aim ball cam at a stationary ball near the roof so the enclosure's top
# surface is visible in deterministic visual QA.
boot-roof = []
# Dev: the full-length roof view (Manny's tape, polls 3260..3480): ball cam
# from one end at a ball held high near the far goal, so the whole roof, both
# side walls and the far end are in view at once. A perf station: the
# costliest single-player view, held still for the 60 fps gate.
boot-roof-length = []
# Dev: ball cam along the far end wall from near the corner, at a ball held
# in the air beside the goal post: the end wall's floor curve close up, the
# post, and the pitch's edge along the end wall, held still.
boot-end-wall = []
# Dev: one fixed side-wall ramp seen from three distances in turn (near, mid
# and far, 150 ticks each, ball cam), to check the ramp's texture is the same
# at every level of detail. The car is held after every tick.
boot-ramp-lod = []
# Dev: the split-screen stress route, bot matches shown the costly way
# (ball cam in both halves, cars close under the chase cameras), straight
# from boot. The gate route for split screen at 30.
boot-split-stress = []
# Dev: boot into a demo route of the matches NITRO_DEMO_PICKS names at build
# time (see main.rs), to try candidate seeds for the attract demo.
boot-demo-picks = []
# Dev: paint the sky (while the camera is close to level) and every car drawn
# from its LOD in key colours (sky magenta, LOD cars pure green) and change
# nothing else, so a headless capture of the attract demo can be checked by
# tools/frame-check (`make demo-check`): sky along the bottom of a level view
# is a hole in the pitch or a wall, and a large green car is the LOD drawn
# where its missing detail shows.
diag-keys = []
# Dev: render every second vblank. Not a shipping mode: a build whose frames
# all fit two vblanks presents on the same ticks as any other such build, so
# two builds' screenshots can be compared tick for tick to prove a speed-up
# left the picture alone (at 60 fps the cadence itself moves the camera).
pace-30 = []
# Deterministic presentation presets for high-resolution capture. Night is the
# shipping default; these two select the other authored looks at boot.
arena-day = []
arena-sunset = []
# Dev: wreck the opponent in front of the camera at kickoff, so a headless
# capture frames a demolition explosion at a known tick.
boot-demo-fx = []
# Dev options for the camera. Field of view is a player setting now (a slider
# in SETTINGS, 60 to 110 degrees, 60 by default for now). `NITRO_FOV=90` in the
# environment of a build changes the step a profile with no saved choice starts
# at, so a view can be measured headlessly. `cam-ball-default` starts every
# match in ball cam.
cam-ball-default = []
# Dev: keep per-frame camera, tyre-track and draw state in RAM rings
# (diaglog.rs) for a headless replay to read back with --dump-ram.
diag-log = []
# Dev: time the audio calls with root counter 2 and print totals on the TTY
# every thousand frames (audio_cost.rs).
diag-audio-cost = []
# Console diagnostic: a sound test on the title screen. L2, L1, R1, R2, Square,
# Triangle and Circle play the goal's sounds one at a time or together, and the
# SPU's own registers for the voices they took (envelope, ended flag, current
# volume) are printed on screen at 3 and 30 ticks after the key-on, so one
# photo of a console says whether the voices started and what they were
# playing at (audio.rs, `sound_test`). Never in a shipping build.
diag-sound = []

[[bin]]
name = "nitroxide"
path = "src/main.rs"

[dependencies]
nitroxide-sim = { path = "../sim" }

psx-asset  = { path = "../.psoxide/sdk/crates/psx-asset" }
psx-rt     = { path = "../.psoxide/sdk/crates/psx-rt", features = ["boot-trace", "hazard-trampolines-256"] }
psx-engine = { path = "../.psoxide/engine/crates/psx-engine", features = ["boot-trace"] }
psx-gpu    = { path = "../.psoxide/sdk/crates/psx-gpu" }
psx-sfx    = { path = "../.psoxide/sdk/crates/psx-sfx" }
psx-gte    = { path = "../.psoxide/sdk/crates/psx-gte" }
psx-font   = { path = "../.psoxide/sdk/crates/psx-font" }
psx-math   = { path = "../.psoxide/sdk/crates/psx-math" }
# Startup asset streaming from the disc's shared WORLD.PAK container.
psx-pack   = { path = "../.psoxide/sdk/crates/psx-pack" }
# Port 2, for the split-screen game. The engine's `Ctx` only carries port 1.
psx-pad    = { path = "../.psoxide/sdk/crates/psx-pad" }
# The CD drive, for WORLD.PAK startup reads and the XA music player.
psx-io     = { path = "../.psoxide/sdk/crates/psx-io" }
# Root directory lookup of the music files (`music.rs`).
psx-fmv    = { path = "../.psoxide/sdk/crates/psx-fmv" }
psx-spu    = { path = "../.psoxide/sdk/crates/psx-spu" }
psx-display = { path = "../.psoxide/sdk/crates/psx-display" }
psx-settings = { path = "../.psoxide/sdk/crates/psx-settings" }
# The memory card itself: the settings save asks before formatting a blank card.
psx-mc     = { path = "../.psoxide/sdk/crates/psx-mc" }
psx-vram   = { path = "../.psoxide/sdk/crates/psx-vram" }
psx-telemetry = { path = "../.psoxide/sdk/crates/psx-telemetry" }
