# This program's exceptions to the SDK's architecture gate (`psx-gate`, the SDK's
# sdk/docs/GATE.md). A ratchet: nothing is added, an entry that no longer matches the tree
# fails (delete it), a count only goes down. `remove` is a short tag: a workstream (W3),
# `unscheduled` or `decision`.

# diag-sound only: the SPU's voice, main volume and ENDX registers read for the console
