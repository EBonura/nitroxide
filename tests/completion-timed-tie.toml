name = "nitroxide-timed-tie"
title = "NitroXide: normal timed-tie match, celebration, results and return"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
pad2 = "analog"
max_ticks = 6100

[[step]]
wait = 440
[[step]]
press = ["cross"]
hold = 4
wait = 120
# Up wraps the initial car row to the rule row. Right moves default 5:00 to timed-tie.
[[step]]
press = ["up"]
hold = 4
wait = 8
[[step]]
press = ["left"]
hold = 4
wait = 8
repeat = 2
[[step]]
checkpoint = "timed-tie-selection"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 2
[[step]]
press = ["cross"]
other = { press = ["cross"] }
hold = 4
wait = 0
[[step]]
# The tile sweep into the match swaps the screen after fifteen ticks.
wait = 24
checkpoint = "timed-kickoff"
golden = false
[[step.assert]]
kind = "not_dark"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 40
op = "between"
value = 3580
value_hi = 3600
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 16, op = "eq", value = 4 }
timeout = 4800
[[step]]
# The tile sweep into the results hides the screen for half a second.
wait = 20
[[step]]
checkpoint = "timed-results"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 40
op = "zero"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 20
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 24
op = "zero"
each = { count = 2, stride = 4 }
[[step]]
press = ["start"]
hold = 4
wait = 20
[[step]]
checkpoint = "returned-title"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 1
