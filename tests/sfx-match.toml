name = "nitroxide-sfx-match"
title = "NitroXide: engine, crowd, jump, flip, landing, boost, empty tank, skid, bounce and pad sounds fire on their events"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 3000
[[step]]
wait = 440
[[step]]
press = ["cross"]
hold = 4
wait = 20
[[step]]
press = ["cross"]
hold = 4
wait = 20
[[step]]
wait = 30
# Throttle: the engine and the crowd loops come on, the pad on the way is taken.
[[step]]
press = ["r2"]
hold = 90
wait = 0
# A jump, then the landing.
[[step]]
press = ["cross"]
hold = 4
wait = 50
[[step]]
press = ["r2"]
hold = 40
wait = 0
# Jump, then a second press with a direction held: a flip.
[[step]]
press = ["cross"]
hold = 4
wait = 8
[[step]]
press = ["cross","up"]
hold = 4
wait = 60
# Boost until the tank is dry.
[[step]]
press = ["r2","circle"]
hold = 240
wait = 0
# Powerslide: handbrake with steering at speed.
[[step]]
press = ["r2","left","l1"]
hold = 100
wait = 0
[[step]]
press = ["r2"]
hold = 100
wait = 0
[[step]]
checkpoint = "car-sounds"
golden = false
