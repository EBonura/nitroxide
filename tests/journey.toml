offset = 96
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 100
op = "eq"
value = 5824
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 104
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 60
op = "zero"
each = { count = 3, stride = 4 }
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 84
op = "zero"
each = { count = 3, stride = 4 }
[[step.assert]]
