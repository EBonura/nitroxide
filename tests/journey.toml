# A normal single-pad match. The throttle and boost input scores through
# the simulation, then the journey observes the full reset and countdown.
name = "nitroxide"
title = "NitroXide: splash through scored goal and kickoff reset"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 3000

[[step]]
wait = 160
[[step]]
checkpoint = "splash"
strict = [{ x = 110, y = 145, w = 110, h = 20 }]
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "presenting"
window = 60
min_changes = 5

[[step]]
wait = 280
[[step]]
checkpoint = "menu"
[[step.assert]]
kind = "presenting"
window = 120
min_changes = 5
[[step.assert]]
kind = "audio"
window = 240
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 1

[[step]]
press = ["cross"]
hold = 4
wait = 120
[[step]]
checkpoint = "select"
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 2

[[step]]
press = ["cross"]
hold = 4
wait = 0
[[step]]
checkpoint = "kickoff"
golden = false
[[step.assert]]
kind = "presenting"
window = 60
min_changes = 5
[[step.assert]]
kind = "pc_not_stuck"
window = 60
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 3

[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 0
op = "eq"
value = 1381255502

[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 4
op = "eq"
value = 1

[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 8
op = "eq"
value = 256

# Drive into real boost pads and shoot from the default kickoff.
[[step]]
press = ["r2", "circle"]
hold = 160
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 44
op = "gt"
value = 0

[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 24, op = "ge", value = 1 }
timeout = 400
[[step]]
checkpoint = "goal"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 24
op = "eq"
value = 1

[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 32
op = "gt"
value = 0

[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 44
op = "gt"
value = 0

# Wait through the goal celebration until the new kickoff begins.
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 36, op = "gt", value = 0 }
timeout = 200
[[step]]
wait = 4
[[step]]
checkpoint = "countdown-3"
strict = [{ x = 150, y = 43, w = 20, h = 4 }]
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 36
op = "between"
value = 120
value_hi = 180
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 44
op = "zero"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 48
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 52
op = "eq"
value = 1792
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 56
op = "eq"
value = -294912
signed = true
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 72
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 76
op = "eq"
value = 1792
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 80
op = "eq"
value = 294912
[[step.assert]]
kind = "ram"
