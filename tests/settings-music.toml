name = "nitroxide-settings-music"
title = "NitroXide: nine settings rows fit the installed music variant"
disc = ["build/gate-music/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 900
[[step]]
wait = 440
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
checkpoint = "music-settings-all-nine-rows"
golden = false
strict = [{ x = 72, y = 150, w = 192, h = 48 }]
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 16
op = "eq"
value = 9
[[step.assert]]
kind = "card_unchanged"
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
checkpoint = "music-save-row-unsaved"
golden = false
strict = [{ x = 72, y = 150, w = 192, h = 48 }]
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 12
op = "eq"
value = 8
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step.assert]]
kind = "card_unchanged"
