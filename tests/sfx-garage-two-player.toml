name = "nitroxide-sfx-garage-two-player"
title = "NitroXide: a seat locking in chimes, unlocking sounds back, the last lock-in says go"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
