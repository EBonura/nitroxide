hold = 4
wait = 12
[[step]]
checkpoint = "first-seat-unlocks"
golden = false
[[step.assert]]
kind = "spu_kon"
addr = 0xe8f0
voice = 6
voice_hi = 7
min_count = 1
window = 20
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
port = 2
hold = 4
wait = 30
[[step]]
checkpoint = "second-seat-locks-and-go"
golden = false
[[step.assert]]
kind = "spu_kon"
addr = 0x13950
voice = 17
voice_hi = 17
min_count = 1
[[step.assert]]
kind = "spu_kon"
addr = 0xfae0
voice = 6
voice_hi = 7
min_count = 2
