name = "nitroxide-practice-timed"
title = "NitroXide: normal practice-timed match, celebration, results and return"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 6100

[[step]]
wait = 440
[[step]]
press = ["down"]
hold = 4
wait = 8
[[step]]
press = ["cross"]
hold = 4
wait = 120
# Up wraps the initial car row to the rule row. Right moves default 5:00 to practice-timed.
[[step]]
press = ["up"]
hold = 4
wait = 8
[[step]]
press = ["left"]
hold = 4
wait = 8
repeat = 2
[[step]]
checkpoint = "practice-timed-selection"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 2
[[step]]
press = ["cross"]
hold = 4
wait = 0
[[step]]
# The tile sweep, then the fly-over (skipped by holding X), then three, two, one.
wait = 34
[[step]]
press = ["cross"]
hold = 62
wait = 0
[[step]]
wait = 186
checkpoint = "timed-kickoff"
golden = false
[[step.assert]]
kind = "not_dark"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 40
op = "between"
value = 3580
value_hi = 3600
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 20
op = "zero"
[[step]]
press = ["r2", "circle"]
hold = 160
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 24, op = "ge", value = 1 }
timeout = 400
[[step]]
checkpoint = "practice-scored-goal"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 28
op = "zero"
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 16, op = "eq", value = 4 }
timeout = 4800
[[step]]
# The tile sweep into the results hides the screen for half a second.
wait = 20
[[step]]
checkpoint = "timed-results"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 40
op = "zero"
[[step]]
# The results scene builds in, then the buttons answer.
wait_until = { kind = "ram", sym = "NITRO_REPLAY_STATE", offset = 48, op = "ge", value = 100 }
timeout = 400
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["start"]
hold = 4
wait = 48
[[step]]
checkpoint = "returned-title"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 1
