# Fixture is the byte-for-byte receipt from the explicit Save Settings gate.
# It stores SFX OFF, whereas a fresh profile defaults to volume 100.
name = "nitroxide-settings-load"
title = "NitroXide: cold load and settings exits preserve a saved card"
disc = ["build/gate/NitroXide.cue"]
pad = "dualshock"
symbols = ["build/gate-symbols.txt"]
memcard = "fresh"
max_ticks = 900
[card_fixture]
path = "tests/fixtures/manual-saved.mcd"
sha256 = "3a5d8e40c349a3c219ba711bfa6551bf2dda43ad539156429dc31bc479dcd79f"
# The title is up (phase 1): the game has read the card and published its settings by then.
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 16, op = "eq", value = 1 }
timeout = 900
[[step]]
checkpoint = "saved-profile-loaded-without-write"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 32
op = "zero"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 20
op = "zero"
[[step.assert]]
kind = "card_unchanged"
# Settings is the second row up from MATCH: CREDITS is the last row. The title publishes no
# cursor, so the two moves count the game's own pad polls; opening and closing the panel wait on
# NITRO_SETTINGS_STATE's panel row (0 closed, row + 1 open).
[[step]]
sync = "poll"
press = ["up"]
hold = 4
[[step]]
sync = "poll"
wait = 12
[[step]]
sync = "poll"
press = ["up"]
hold = 4
[[step]]
sync = "poll"
wait = 12
[[step]]
press = ["cross"]
hold_until = { kind = "ram", sym = "NITRO_SETTINGS_STATE", offset = 12, op = "ne", value = 0 }
timeout = 120
[[step]]
press = ["circle"]
hold_until = { kind = "ram", sym = "NITRO_SETTINGS_STATE", offset = 12, op = "eq", value = 0 }
timeout = 120
# As long as the exit took before, now in game polls: a write the exit started would land here.
[[step]]
sync = "poll"
wait = 20
[[step]]
checkpoint = "loaded-profile-exit-without-write"
golden = false
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 12
op = "zero"
[[step]]
card = { action = "snapshot" }
