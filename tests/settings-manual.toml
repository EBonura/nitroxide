# Works with both the seven-row data disc and nine-row music disc.
name = "nitroxide-settings-manual"
title = "NitroXide: settings exits preserve card, explicit Save survives reboot"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 2200
memcard = "fresh"

[[step]]
wait = 440
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 32
op = "eq"
value = 100

# From MATCH, Up wraps directly to SETTINGS.
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["down"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
checkpoint = "settings-unsaved"
golden = false
strict = [{ x = 72, y = 150, w = 192, h = 48 }]
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 20
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 32
op = "zero"
[[step.assert]]
kind = "card_unchanged"

[[step]]
press = ["circle"]
hold = 4
wait = 20
[[step]]
checkpoint = "circle-closes-without-save"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 12
op = "zero"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 24
op = "zero"
[[step.assert]]
kind = "card_unchanged"

[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["start"]
hold = 4
wait = 20
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 12
op = "zero"

# Cross on Back also closes without saving.
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["cross"]
hold = 4
wait = 20
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 12
op = "zero"

# Two Up presses wrap from Arena through Back to Save Settings.
[[step]]
press = ["cross"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["up"]
hold = 4
wait = 12
[[step]]
press = ["right"]
hold = 4
wait = 12
[[step]]
checkpoint = "save-selected-no-write"
golden = false
strict = [{ x = 72, y = 150, w = 192, h = 48 }]
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 24
op = "zero"
[[step]]
press = ["cross"]
hold = 4
wait = 80
[[step]]
checkpoint = "explicit-save-completed"
golden = false
strict = [{ x = 72, y = 150, w = 192, h = 48 }]
[[step.assert]]
kind = "card_writes"
min_count = 1
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 28
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 20
op = "zero"

[[step]]
card = { action = "snapshot" }
[[step]]
card = { action = "reboot" }
[[step]]
wait = 440
[[step]]
checkpoint = "saved-settings-loaded"
golden = false
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 32
op = "zero"
[[step.assert]]
kind = "ram"
sym = "NITRO_SETTINGS_STATE"
offset = 24
op = "zero"
# The separate saved-fixture cold-load journey checks card preservation on
# load. This gate's initial-card reference remains the pre-save fresh card.
