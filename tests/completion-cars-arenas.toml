name = "nitroxide-cars-arenas"
title = "NitroXide: all three cars and arena rigs through normal completed matches"
disc = ["build/gate/NitroXide.cue"]
symbols = ["build/gate-symbols.txt"]
max_ticks = 12000
[[step]]
wait = 440
[[step]]
press = ["cross"]
hold = 4
wait = 120
# Up wraps the initial car row to the rule row. Right moves default 5:00 to first-to-one.
[[step]]
press = ["up"]
hold = 4
wait = 8
[[step]]
press = ["right"]
hold = 4
wait = 8
[[step]]
checkpoint = "car-0-night-first-to-one-selection"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 2
[[step]]
press = ["cross"]
hold = 4
wait = 0
[[step]]
# The tile sweep, then the fly-over (skipped by holding X), then three, two, one.
wait = 34
[[step]]
press = ["cross"]
hold = 62
wait = 0
[[step]]
wait = 180
[[step]]
press = ["r2", "circle"]
hold = 160
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 24, op = "eq", value = 1 }
timeout = 400
[[step]]
checkpoint = "car-0-night-final-goal-celebration"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 32
op = "gt"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 3
[[step]]
wait_until = { kind = "ram", sym = "NITRO_GATE_STATE", offset = 16, op = "eq", value = 4 }
timeout = 200
[[step]]
# The tile sweep into the results hides the screen for half a second.
wait = 20
[[step]]
checkpoint = "car-0-night-first-to-one-results"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 24
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 28
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 32
op = "zero"
[[step]]
press = ["cross"]
hold = 4
wait = 20
[[step]]
checkpoint = "car-0-night-returned-title"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "NITRO_GATE_STATE"
offset = 16
op = "eq"
value = 1
[[step]]
press = ["cross"]
hold = 4
wait = 120
# Up wraps the initial car row to the rule row. Right moves default 5:00 to first-to-one.
